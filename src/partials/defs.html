<!-- Shared drawings -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="puff" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <linearGradient id="gMount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--mount-1)"/><stop offset="1" style="stop-color:var(--mount-2)"/>
    </linearGradient>
    <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--hb-1)"/><stop offset=".6" style="stop-color:var(--hb-2)"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--hm-1)"/><stop offset=".6" style="stop-color:var(--hm-2)"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--hf-1)"/><stop offset=".7" style="stop-color:var(--hf-2)"/>
    </linearGradient>

    <symbol id="cloud" viewBox="0 0 200 90">
      <g filter="url(#puff)">
        <ellipse cx="102" cy="66" rx="84" ry="16" fill="var(--cloud-shade)"/>
        <circle cx="62" cy="52" r="26" fill="var(--cloud)"/>
        <circle cx="98" cy="38" r="34" fill="var(--cloud)"/>
        <circle cx="138" cy="50" r="27" fill="var(--cloud)"/>
        <ellipse cx="100" cy="60" rx="82" ry="15" fill="var(--cloud)"/>
      </g>
    </symbol>
    <symbol id="cypress" viewBox="-24 -160 48 175" overflow="visible">
      <path d="M0 0 C-20 -40 -18 -96 0 -156 C18 -96 20 -40 0 0Z" fill="var(--tree)"/>
      <path d="M0 -150 C10 -96 12 -40 0 0 C14 -40 16 -96 0 -156Z" fill="var(--tree-2)" opacity=".55"/>
      <path d="M0 0 V10" stroke="var(--tree-2)" stroke-width="3"/>
    </symbol>
    <!-- a young woman at her laptop: sleek long hair, a cream knit top, wide-leg trousers and loafers
         (the same flat style as the hills: dark outlines, soft fills) -->
    <symbol id="sitter" viewBox="-24 -56 48 58" overflow="visible">
      <!-- the chair -->
      <path d="M-13 0 V-38 M9 0 V-15 M-13 -15 H11 M-15.4 -38 H-10.6 M-13 -31.6 H-10.6 M-13 -25.2 H-10.6" stroke="var(--figure)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- wide-leg trousers and loafers -->
      <path d="M-8.4 -16.6 H7.2" stroke="var(--figure)" stroke-width="6" stroke-linecap="round"/>
      <path d="M7.2 -16 L8.4 -3.4" stroke="var(--figure)" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M-8.4 -16.6 H7.2" stroke="#5B6E9C" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M7.2 -16 L8.4 -3.4" stroke="#5B6E9C" stroke-width="3.1" stroke-linecap="round"/>
      <path d="M5.6 -3.6 H11.2 L11.6 -1.8 H5.4Z" fill="#5B6E9C" stroke="var(--figure)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M6.4 -1.8 H12.6 Q14.6 -1.8 14.4 0 H6.2Z" fill="var(--figure)"/>
      <!-- long hair falling down her back, behind the top -->
      <path d="M-1.6 -45.6 C-5 -46.4 -7.6 -44.4 -7.6 -41.2 C-7.6 -38.4 -7.2 -35.6 -7.8 -32.6 C-8.4 -30 -8.6 -27.6 -7.4 -25.6 C-6.2 -25.8 -5.4 -27.2 -5.2 -28.8 C-5 -32 -5.4 -35.2 -4.6 -37.8Z" fill="var(--figure)"/>
      <!-- a cream knit top, tucked in at the waist -->
      <path d="M-8.8 -16.8 C-9.8 -22.6 -9.6 -28.6 -6.8 -32.6 Q-3.4 -34.6 -.2 -32.8 C1.8 -30.6 2.4 -27.6 1.2 -24.6 C.6 -22 .6 -19.4 .8 -16.8Z" fill="#FFFDF7" stroke="var(--figure)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-8.6 -18.6 H.8" stroke="var(--figure)" stroke-width=".9"/>
      <path d="M-7.6 -21 C-7.8 -24 -7.8 -27 -7 -30 M-5.4 -21 C-5.6 -24 -5.6 -27.4 -4.8 -30.6" stroke="#E4DCCB" stroke-width=".7" fill="none" stroke-linecap="round"/>
      <!-- her arm: knit sleeve, then the forearm resting on the keyboard -->
      <path d="M-4.2 -31.4 C-2 -28 .8 -25.6 4 -24.8" stroke="var(--figure)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-4.2 -31.4 C-2 -28 .8 -25.6 4 -24.8" stroke="#FFFDF7" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M4 -24.8 C8 -25 12.4 -26.2 16.6 -26.8" stroke="var(--figure)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M4 -24.8 C8 -25 12.4 -26.2 16.6 -26.8" stroke="#EECBB0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- neck and face in profile -->
      <path d="M-3.4 -33.4 L-3 -37.2" stroke="var(--figure)" stroke-width="3" stroke-linecap="round"/>
      <path d="M-3.4 -33.4 L-3 -37.2" stroke="#EECBB0" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M-5.6 -41.6 C-5.6 -44.6 -3.6 -46.4 -1.2 -46.4 C1.2 -46.4 2.6 -44.6 2.6 -42.4 C2.6 -41.8 3.4 -41 3.2 -40.6 C3 -40.2 2.4 -40.2 2.5 -39.6 C2.6 -39 2.2 -38.6 2 -38.4 C1.6 -37.4 .4 -36.8 -1 -36.8 C-3.6 -36.8 -5.6 -38.8 -5.6 -41.6Z" fill="#EECBB0" stroke="var(--figure)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M.2 -41.8 C.8 -41.4 1.4 -41.4 1.9 -41.8" stroke="var(--figure)" stroke-width=".6" fill="none" stroke-linecap="round"/>
      <path d="M1.9 -41.8 L2.4 -42.3 M1.5 -41.6 L1.8 -42.2" stroke="var(--figure)" stroke-width=".4" stroke-linecap="round"/>
      <path d="M1.6 -38.8 H2.4" stroke="#C97A7A" stroke-width=".7" stroke-linecap="round"/>
      <!-- sleek hair on top, parted, tucked behind her ear -->
      <path d="M-6.2 -40 C-7.2 -44.6 -4.6 -47.8 -.8 -47.6 C2.4 -47.4 3.8 -45.4 3.2 -43.4 C1.4 -44.2 -.6 -44.4 -2.2 -43.6 C-3.4 -42.8 -3.6 -41.4 -4 -40 C-4.6 -38.6 -5.6 -38.6 -6.2 -40Z" fill="var(--figure)"/>
      <circle cx="-3.4" cy="-37.8" r=".75" fill="none" stroke="#D9AE4E" stroke-width=".6"/>
    </symbol>
  </defs>
</svg>
